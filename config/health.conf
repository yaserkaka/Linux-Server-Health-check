# server-health configuration
# Sourced by the bash scripts, so keep it plain KEY=VALUE (no spaces around =).
# On managed hosts this file is generated by Ansible from group_vars - edit
# the inventory, not the file on the server.

# --- resource thresholds (percent) ---
CPU_WARN=75
CPU_CRIT=85
MEM_WARN=80
MEM_CRIT=90
DISK_WARN=70
DISK_CRIT=80
INODE_CRIT=90

# load is compared per CPU core (5 min average)
LOAD_WARN_PER_CORE=1.0
LOAD_CRIT_PER_CORE=2.0

# mount points to check, space separated
DISK_MOUNTS="/"

# --- network ---
PING_TARGET="1.1.1.1"
INTERNET_URL="https://www.google.com"
DNS_TEST_NAME="ubuntu.com"
# leave empty to use the system resolver
DNS_SERVER=""
HTTP_URL="http://localhost/"
TCP_PORTS="22 80"
NET_TIMEOUT=3

# --- services ---
# ssh is special-cased (socket activation on 24.04), see check_ssh
SERVICES="nginx ssh docker"
# only these get restarted automatically
SELF_HEAL_SERVICES="nginx"
MAX_RESTART_ATTEMPTS=3
# attempts are counted inside this window, so a flapping service
# can't be restarted forever
RESTART_WINDOW_SEC=3600
RESTART_WAIT_SEC=3

# units that should never be reported by the failed-units check
FAILED_UNITS_IGNORE="server-health.service"

# --- output / alerting ---
LOG_DIR="/var/log/server-health"
STATE_DIR="/var/lib/server-health"
ALERT_CMD="/usr/bin/python3 /opt/server-health/python/alert.py"
# statuses that trigger an external notification
ALERT_ON="CRITICAL RECOVERED"
ALERT_CHANNELS="slack"
ALERT_COOLDOWN_SEC=1800
